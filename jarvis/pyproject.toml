[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "Jarvis - a real-time voice AI assistant for your computer, powered by Gemini."
readme = "README.md"
authors = [{ name = "Musaddiq Khan", email = "musaddiqkhan001@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "google-genai==2.23.0",
    "numpy==2.4.6",
    "sounddevice==0.5.6",
    "psutil==7.2.2",
    "requests==2.34.2",
    "ddgs==9.16.1",
    "send2trash==2.1.0",
    "PyQt6==6.11.0",
    "PyAutoGUI==0.9.54",
    "pyperclip==1.11.0",
    "mss==10.2.0",
    "pillow==13.0.0",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "openwakeword==0.6.0",
]

[project.optional-dependencies]
camera = ["opencv-python"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
